<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/ec-logo.png" type="image/png" />
    <title>Experience Caddie — Golf + Concert Weekends, Planned for You</title>

    <!-- Establish early connections to font origins before CSS requests them.
         Eliminates the DNS + TLS negotiation cost from the critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts directly from <head> rather than via CSS @import so the
         browser discovers them without waiting for CSS parsing. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" />
    <meta name='impact-site-verification' value='012d7b3c-8a21-479f-930c-3e42a9b25bef'>
    <meta name="description" content="Plan a golf + concert weekend in minutes. Choose an artist or city and we'll build three bookable packages — tee times, tickets, and hotels — around confirmed tour dates." />
    <meta name="author" content="Experience Caddie" />

    <!-- Awin affiliate program — site ownership verification (https://experiencecaddie.com/) -->
    <meta name="verification" content="b7a16902963387a1fd7f431c4eac2ccc" />
    <!-- Google Search Console ownership verification (both tokens: prior + current property) -->
    <meta name="google-site-verification" content="1vwT_GhGVOhAfRlXFQA9x-Iz3ROZY3vLmFe4Kn129yY" />
    <meta name="google-site-verification" content="fNOszW3cRci5dh4hHj1cxj3CpvCGsD7Kx5JyOGXlkB8" />

    <meta property="og:title" content="Experience Caddie — Golf + Concert Weekends" />
    <meta property="og:description" content="Pick an artist or city. We'll build three bookable golf + concert weekend packages around confirmed tour dates — tee times, tickets, and hotels included." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://experiencecaddie.com" />
    <meta property="og:image" content="https://experiencecaddie.com/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ExperienceCaddie" />
    <meta name="twitter:image" content="https://experiencecaddie.com/og-image.jpg" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Experience Caddie",
      "url": "https://experiencecaddie.com",
      "description": "Experience Caddie plans golf and concert weekend packages — tee times, concert tickets, and hotels around confirmed tour dates. Search by artist or city to find bookable packages.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://experiencecaddie.com/experience?event_details={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Experience Caddie",
      "url": "https://experiencecaddie.com",
      "description": "Experience Caddie plans golf and concert weekend packages for groups who want to combine a round of golf with a live concert. Packages match confirmed tour dates with nearby public golf courses and include tee times, concert tickets, and hotel options.",
      "parentOrganization": {
        "@type": "Organization",
        "name": "Fairways & Encores"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "privacy@experiencecaddie.com",
        "contactType": "customer support"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
