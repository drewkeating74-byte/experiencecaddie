name: Daily Discovery Refresh

# Runs every day at 09:00 UTC.
# Calls the refresh-discovery edge function which repopulates the
# discovery_shows cache (upcoming weekend concerts across catalog metros) from
# Ticketmaster. The itinerary builder serves genre / "best upcoming shows"
# discovery from this cache instead of calling Ticketmaster live.
on:
  schedule:
    - cron: "0 9 * * *"    # Daily 09:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab
    inputs:
      mode:
        description: "Refresh mode: 'tm' (TM + audience + hot backfill), 'backfill_artists', 'backfill_hot_artists', or 'seed_from_events'"
        required: false
        default: "tm"
        type: choice
        options:
          - tm
          - backfill_artists
          - backfill_hot_artists
          - seed_from_events

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Run refresh-discovery edge function
      env:
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        MODE: ${{ github.event.inputs.mode || 'tm' }}
      run: |
          if [ "$MODE" = "seed_from_events" ]; then
            PAYLOADS=('{"mode":"seed_from_events"}')
          elif [ "$MODE" = "backfill_artists" ]; then
            PAYLOADS=('{"mode":"backfill_artists"}')
          elif [ "$MODE" = "backfill_hot_artists" ]; then
            PAYLOADS=('{"mode":"backfill_hot_artists"}')
          else
            # Daily: genre pages → audience headliners → weekly What's Hot artists
            PAYLOADS=('{}' '{"mode":"backfill_artists"}' '{"mode":"backfill_hot_artists"}')
          fi
          echo "Dispatch mode: $MODE"

          for PAYLOAD in "${PAYLOADS[@]}"; do
            echo "Payload: $PAYLOAD"
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              "https://kxibaydbhquospzoefva.supabase.co/functions/v1/refresh-discovery" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -d "$PAYLOAD")

            HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

            echo "Status: $HTTP_STATUS"
            echo "Response: $HTTP_BODY"

            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "::error::refresh-discovery returned HTTP $HTTP_STATUS"
              exit 1
            fi
          done
