name: Verify packages (Ticketmaster)

# ~Biweekly: 1st and 15th of each month at 05:15 UTC (~every two weeks on average).
# Calls verify-packages to deactivate catalog rows that no longer match TM on the same date,
# refresh direct ticket URLs on events, and backfill verified curated rows so 25 stay active.
#
# Requires: secrets.SUPABASE_SERVICE_ROLE_KEY (same as packages-maintenance)
on:
  schedule:
    - cron: "15 5 1,15 * *"
  workflow_dispatch:
    inputs:
      suggest:
        description: "Append metro_gaps (metros with no active curated package)"
        required: false
        default: "false"
        type: boolean
      dry_run:
        description: "Preview only — no deactivations or URL updates"
        required: false
        default: "false"
        type: boolean
      recover:
        description: "Include inactive future packages and reactivate only verified rows"
        required: false
        default: "false"
        type: boolean
      backfill:
        description: "Fill active curated catalog back to 25 verified packages"
        required: false
        default: "true"
        type: boolean
      strict_direct_tm:
        description: "Require direct Ticketmaster event URL (stricter)"
        required: false
        default: "false"
        type: boolean
      require_venue_match:
        description: "Require catalog venue tokens to overlap TM venue (stricter; can mass-fail)"
        required: false
        default: "false"
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUGGEST_INPUT: ${{ github.event.inputs.suggest || 'false' }}
      DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
      RECOVER_INPUT: ${{ github.event.inputs.recover || 'false' }}
      BACKFILL_INPUT: ${{ github.event_name == 'schedule' && 'true' || (github.event.inputs.backfill || 'true') }}
      STRICT_TM_INPUT: ${{ github.event.inputs.strict_direct_tm || 'false' }}
      REQUIRE_VENUE_INPUT: ${{ github.event.inputs.require_venue_match || 'false' }}

    steps:
      - name: Invoke verify-packages
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          Q=()
          [ "$SUGGEST_INPUT" = "true" ] && Q+=("suggest=1")
          [ "$DRY_RUN_INPUT" = "true" ] && Q+=("dry_run=1")
          [ "$RECOVER_INPUT" = "true" ] && Q+=("recover=1")
          [ "$BACKFILL_INPUT" = "true" ] && Q+=("backfill=1")
          [ "$STRICT_TM_INPUT" = "true" ] && Q+=("strict_direct_tm=1")
          [ "$REQUIRE_VENUE_INPUT" = "true" ] && Q+=("require_venue_match=1")
          QUERY=""
          if [ ${#Q[@]} -gt 0 ]; then
            IFS='&'
            QUERY="?${Q[*]}"
            unset IFS
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "https://kxibaydbhquospzoefva.supabase.co/functions/v1/verify-packages${QUERY}" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_STATUS"
          echo "Response: $HTTP_BODY"

          echo "Verification summary:"
          echo "$HTTP_BODY" | jq -r '
            "  checked: \(.checked // 0)",
            "  verified_ticketmaster: \(.verified_ticketmaster // 0)",
            "  verified_perplexity: \(.verified_perplexity // 0)",
            "  first_failed_needs_review: \(.first_failed // 0)",
            "  second_failed_hidden: \(.second_failed_hidden // 0)",
            "  expired_hidden: \(.expired_hidden // 0)",
            "  recovered: \(.recovered // 0)",
            "  provider_errors: \(.provider_errors // 0)",
            "  skipped_incomplete: \(.skipped_incomplete // 0)",
            "  ticket_url_refreshed: \(.ticket_url_refreshed // 0)",
            "  backfill_active_before: \(.backfill_result.active_curated_before // "n/a")",
            "  backfill_gap: \(.backfill_result.gap // "n/a")",
            "  backfill_candidates_considered: \(.backfill_result.candidates_considered // "n/a")",
            "  backfill_inserted: \(.backfill_result.inserted // "n/a")"
          ' || true

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::verify-packages returned HTTP $HTTP_STATUS"
            exit 1
          fi
