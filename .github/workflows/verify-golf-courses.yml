name: Golf Course Verification

# Runs 4× daily at 03:00 / 09:00 / 15:00 / 21:00 UTC. Both passes every run.
#
# Rationale:
#   - Golf-course public-access status is effectively static once confirmed.
#   - Post-drain the queues are empty, so each run is near-zero-cost
#     (mostly empty queries; no Places / Perplexity when nothing is queued).
#   - After a catalog flood, 4× daily drains the unreviewed + needs_review
#     queues in ~1 week instead of ~1 month at a single daily cadence.
#
# Manual dispatch:
#   - Use workflow_dispatch for ad-hoc runs (e.g. right after ingesting
#     a new metro).
#   - skip_llm=true runs rule-based only; useful if Perplexity credits
#     are temporarily exhausted.
#
# Future: annual full-catalog re-verification can be added as a second
# schedule with a dedicated payload that resets verification_status on
# all courses. Not needed at MVP scale.

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"   # 4× daily UTC — both passes
  workflow_dispatch:
    inputs:
      skip_llm:
        description: "Skip LLM/Perplexity pass (rule-based only)"
        required: false
        default: "false"
      reason:
        description: "Reason for manual run (optional)"
        required: false
        default: "manual"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Run verify-golf-courses edge function
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Scheduled runs always run both passes.
          # Manual dispatch respects the skip_llm input.
          SKIP_LLM="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SKIP_LLM="${{ github.event.inputs.skip_llm }}"
            echo "Manual run — skip_llm=${SKIP_LLM}"
          else
            echo "Scheduled run — running both passes"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "https://kxibaydbhquospzoefva.supabase.co/functions/v1/verify-golf-courses" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -d "{\"skip_llm\": $SKIP_LLM}")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_STATUS"
          echo "Response: $HTTP_BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::verify-golf-courses returned HTTP $HTTP_STATUS"
            exit 1
          fi
