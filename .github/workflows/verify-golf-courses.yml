name: Golf Course Verification

# Two scheduled passes — golf course access status changes rarely so daily
# was overkill and unnecessarily burned Perplexity API credits.
#
# Weekly  (Sunday 03:00 UTC)  — Pass 1 only: rule-based Google Places check.
#   Fetches Place Details for up to 50 unreviewed courses and auto-verifies
#   those with clear public signals. No Perplexity calls. Free to run often.
#
# Monthly (1st  03:00 UTC)    — Both passes: rule-based + LLM.
#   Also runs Pass 2: Perplexity sonar checks up to 20 needs_review courses
#   with unknown or likely_private confidence against live web data.
#
# Manual trigger via workflow_dispatch runs both passes by default;
# set skip_llm=true to run rule-based only.

on:
  schedule:
    - cron: "0 3 * * 0"   # Weekly  — Sunday  03:00 UTC (rule-based only)
    - cron: "0 3 1 * *"   # Monthly — 1st     03:00 UTC (both passes)
  workflow_dispatch:
    inputs:
      skip_llm:
        description: "Skip LLM/Perplexity pass (rule-based only)"
        required: false
        default: "false"
      reason:
        description: "Reason for manual run (optional)"
        required: false
        default: "manual"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Run verify-golf-courses edge function
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Determine whether to skip the LLM pass.
          # Weekly schedule (0 3 * * 0) → rule-based only.
          # Monthly schedule (0 3 1 * *) → both passes.
          # Manual dispatch → respects the skip_llm input.
          SKIP_LLM="false"
          if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
            SKIP_LLM="true"
            echo "Weekly run — skipping LLM pass"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SKIP_LLM="${{ github.event.inputs.skip_llm }}"
            echo "Manual run — skip_llm=${SKIP_LLM}"
          else
            echo "Monthly run — running both passes"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "https://kxibaydbhquospzoefva.supabase.co/functions/v1/verify-golf-courses" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -d "{\"skip_llm\": $SKIP_LLM}")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_STATUS"
          echo "Response: $HTTP_BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::verify-golf-courses returned HTTP $HTTP_STATUS"
            exit 1
          fi
