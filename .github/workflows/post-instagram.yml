name: Post to Instagram

# Runs Tuesday, Thursday, and Saturday at 2pm UTC (~9am Central).
# Picks pending rows from instagram_queue and adds them to Buffer's channel queue
# so Buffer uses the posting schedule configured for each channel.
#
# Manual dispatch options:
#   dry_run=true   → preview without posting
#   post_now=true  → custom schedule 30 minutes from now instead of queueing

on:
  schedule:
    - cron: "0 14 * * 2,4,6"   # Tue, Thu, Sat 14:00 UTC ≈ 9:00am Central
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — no API calls"
        required: false
        default: "false"
        type: boolean
      post_now:
        description: "Publish immediately (skip scheduling)"
        required: false
        default: "false"
        type: boolean

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Post pending queue items to Instagram
        env:
          BUFFER_ACCESS_TOKEN:  ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID:    ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          PGHOST:               ${{ secrets.PGHOST }}
          PGPORT:               ${{ secrets.PGPORT }}
          PGUSER:               ${{ secrets.PGUSER }}
          PGPASSWORD:           ${{ secrets.PGPASSWORD }}
          PGDATABASE:           ${{ secrets.PGDATABASE }}
        run: |
          FLAGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "${{ github.event.inputs.post_now }}" = "true" ] && FLAGS="$FLAGS --now"
          node scripts/post-to-instagram.mjs $FLAGS
