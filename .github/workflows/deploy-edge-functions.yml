name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      function:
        description: "Function to deploy (leave blank to deploy all)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: supabase/setup-cli@v1
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          version: latest

      - name: Deploy all functions
        if: ${{ github.event.inputs.function == '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref kxibaydbhquospzoefva

      - name: Deploy single function
        if: ${{ github.event.inputs.function != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ${{ github.event.inputs.function }} --project-ref kxibaydbhquospzoefva
